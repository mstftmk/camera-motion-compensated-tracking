[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-motion-compensated-tracking"
version = "0.1.0"
description = "OC-SORT multi-object tracking with global (camera) motion compensation, compared on MOT17"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mustafa Tomak" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
results = ["matplotlib>=3.7", "pandas>=2.0", "scikit-image>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
